# ==============================================================================
# YGGDRASIL DATA PLATFORM — 02-LANGFUSE (PRODUCTION LLMOPS STACK)
# ==============================================================================
# Kiến trúc Production LLMOps chuẩn mực với ClickHouse OLAP Backend:
# 1. langfuse-web: Next.js Frontend Dashboard & Ingestion API (:3100 -> :3000)
# 2. langfuse-worker: Async background processor cho heavy metrics & evals
# 3. clickhouse: ClickHouse 24.3 OLAP Engine lưu trữ hàng chục triệu traces (:8123, :9002)
# 4. postgres: PostgreSQL 16 lưu trữ metadata, users, prompts, RBAC
# 5. redis: Redis 7 cho caching & background message queue
# 6. minio: S3-compatible Object Storage lưu trữ raw payload & attachments
# 7. ai-gateway: Langfuse Native AI Gateway (Rust LLM Proxy :3031)
# 8. litellm-proxy: LiteLLM Proxy (:4000) — Cầu dao Cắt tiền Tự động (Hard Spend Cap),
#    Rate-Limiting (RPM/TPM) & Cấp/Thu hồi Virtual API Key tức thì cho từng Phòng ban
# ==============================================================================

name: yggdrasil-langfuse

networks:
  langfuse-net:
    driver: bridge

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:

services:
  # ============================================================================
  # 1. METADATA DATABASE (POSTGRESQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: yggdrasil-langfuse-postgres
    restart: unless-stopped
    networks:
      - langfuse-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langfuse} -d ${POSTGRES_DB:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================================
  # 2. OLAP ANALYTICS DATABASE (CLICKHOUSE LATEST)
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: yggdrasil-langfuse-clickhouse
    restart: unless-stopped
    networks:
      - langfuse-net
    user: "101:101"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret_password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9002}:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================================
  # 3. MESSAGE QUEUE & CACHE (REDIS 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: yggdrasil-langfuse-redis
    restart: unless-stopped
    networks:
      - langfuse-net
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 4. OBJECT STORAGE (MINIO / S3)
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: yggdrasil-langfuse-minio
    restart: unless-stopped
    networks:
      - langfuse-net
    entrypoint: sh
    command: -c 'mkdir -p /data/$${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse} && minio server --address ":9000" --console-address ":9091" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_2026}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
    volumes:
      - langfuse_minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9090}:9000"
      - "${MINIO_CONSOLE_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ============================================================================
  # 5. LANGFUSE WEB & INGESTION API
  # ============================================================================
  langfuse-web:
    image: langfuse/langfuse:latest
    container_name: yggdrasil-langfuse-web
    restart: unless-stopped
    networks:
      - langfuse-net
    ports:
      - "${LANGFUSE_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-langfuse_secret_password}@postgres:5432/${POSTGRES_DB:-langfuse}
      DIRECT_URL: postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-langfuse_secret_password}@postgres:5432/${POSTGRES_DB:-langfuse}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret_password}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3100}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-yggdrasil_langfuse_nextauth_secret_2026}
      SALT: ${SALT:-yggdrasil_langfuse_salt_key_2026}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_2026}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_FORCE_PATH_STYLE: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_AI_GATEWAY_DEPLOYED: "true"
      LANGFUSE_AI_GATEWAY_ENABLED: "true"
      LANGFUSE_AI_GATEWAY_URL: http://ai-gateway:3031
      LANGFUSE_AI_GATEWAY_PUBLIC_URL: ${LANGFUSE_AI_GATEWAY_PUBLIC_URL:-http://localhost:3031}
      LANGFUSE_AI_GATEWAY_SERVICE_KEY: ${LANGFUSE_AI_GATEWAY_SERVICE_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY: ${LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ============================================================================
  # 6. LANGFUSE ASYNC BACKGROUND WORKER
  # ============================================================================
  langfuse-worker:
    image: langfuse/langfuse-worker:latest
    container_name: yggdrasil-langfuse-worker
    restart: unless-stopped
    networks:
      - langfuse-net
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-langfuse_secret_password}@postgres:5432/${POSTGRES_DB:-langfuse}
      DIRECT_URL: postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-langfuse_secret_password}@postgres:5432/${POSTGRES_DB:-langfuse}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret_password}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      SALT: ${SALT:-yggdrasil_langfuse_salt_key_2026}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_2026}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_AI_GATEWAY_DEPLOYED: "true"
      LANGFUSE_AI_GATEWAY_ENABLED: "true"
      LANGFUSE_AI_GATEWAY_URL: http://ai-gateway:3031
      LANGFUSE_AI_GATEWAY_SERVICE_KEY: ${LANGFUSE_AI_GATEWAY_SERVICE_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY: ${LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy

  # ============================================================================
  # 7. LANGFUSE NATIVE AI GATEWAY (RUST PROXY ENGINE)
  # ============================================================================
  ai-gateway:
    image: langfuse/ai-gateway:latest
    container_name: yggdrasil-langfuse-ai-gateway
    restart: unless-stopped
    networks:
      - langfuse-net
    depends_on:
      langfuse-web:
        condition: service_healthy
    ports:
      - "${LANGFUSE_AI_GATEWAY_PORT:-3031}:3031"
    environment:
      LANGFUSE_AI_GATEWAY_WEB_URL: http://langfuse-web:3000
      LANGFUSE_AI_GATEWAY_ALLOW_HTTP_WEB_URL: "true"
      LANGFUSE_AI_GATEWAY_LISTEN_ADDRESS: 0.0.0.0:3031
      LANGFUSE_AI_GATEWAY_SERVICE_KEY: ${LANGFUSE_AI_GATEWAY_SERVICE_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY: ${LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY}
      LANGFUSE_AI_GATEWAY_ALLOW_MISSING_SERVICE_KEY: "true"
      LANGFUSE_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3031/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ============================================================================
  # 8. LITELLM PROXY — CẦU DAO CẮT TIỀN TỰ ĐỘNG & THU HỒI API KEY (:4000)
  # ============================================================================
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: yggdrasil-litellm-proxy
    restart: unless-stopped
    networks:
      - langfuse-net
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-yggdrasil-master-admin-2026}
      LITELLM_SALT_KEY: ${SALT:-yggdrasil_langfuse_salt_key_2026}
      # Dùng chung container Postgres nhưng tách schema riêng `litellm` để không đụng bảng của Langfuse
      LITELLM_DATABASE_URL: postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-langfuse_secret_password}@postgres:5432/${POSTGRES_DB:-langfuse}?schema=litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Tự động đẩy toàn bộ Trace, Cost USD & lỗi bị cắt ngân sách sang Langfuse
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-test}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-test}
      # Upstream Provider Keys / Langfuse AI Gateway
      UPSTREAM_LLM_API_BASE: ${UPSTREAM_LLM_API_BASE:-http://ai-gateway:3031/v1}
      UPSTREAM_LLM_API_KEY: ${UPSTREAM_LLM_API_KEY:-lf-gw-default-upstream-key}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-deepseek-chat}
      NVIDIA_NIM_API_BASE: ${NVIDIA_NIM_API_BASE:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
