# ==============================================================================
# Y7L NATIVE — LITELLM PROXY CONFIG (STANDALONE PROFILE)
# ==============================================================================
model_list:
  - model_name: yggdrasil-default-llm
    litellm_params:
      model: openai/${DEFAULT_LLM_MODEL:-deepseek-chat}
      api_base: ${UPSTREAM_LLM_API_BASE:-https://api.deepseek.com/v1}
      api_key: os.environ/LLM_API_KEY
      rpm: 60
      tpm: 80000

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  - model_name: whisper-1
    litellm_params:
      model: openai/whisper-1
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  max_budget: 50.0
  budget_duration: 30d
  request_timeout: 60
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  allow_requests_on_db_unavailable: true
