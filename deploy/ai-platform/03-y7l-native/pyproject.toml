[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "y7l-native"
version = "0.1.0"
description = "Y7L Native v0.1 — Thin Track-B Sidecar for n8n-centric Data-Blind SQL, Hybrid RAG, Minimal Voice & Day-1 FinOps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "duckdb>=1.1.0",
    "pyyaml>=6.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/y7l_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
